# The checks that need no app window: TypeScript, ESLint, the build and the unit suites (verify.mjs --quick).
# The Electron UI steps need a desktop session, so run the full `node scripts/verify.mjs` locally before merging.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Waypoint ships for Windows only, so the checks run where it runs.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check formatting
        run: npm run format:check
      - name: TypeScript, ESLint, build and unit suites
        run: node scripts/verify.mjs --quick --logs verify-logs
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify-logs
